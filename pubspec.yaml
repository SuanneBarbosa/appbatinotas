name: combinasom_algebrico
version: 1.0.0+1
publish_to: 'none'
description: App educacional para investigar combinatória sonora, regra geral e infinito.

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.20.2
  audioplayers: ^6.6.0
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo/
    - assets/sounds/baixo/
    - assets/sounds/banjo/
    - assets/sounds/flauta/
    - assets/sounds/flautadoce/
    - assets/sounds/guitarra/
    - assets/sounds/orgao/
    - assets/sounds/piano/
    - assets/sounds/pianoeletrico/
    - assets/sounds/sitar/
    - assets/sounds/trompete/
    - assets/sounds/violino/
    - assets/sounds/others/
    - assets/images/animacao/alto_falante.gif
